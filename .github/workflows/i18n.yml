name: i18n

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  i18n:
    name: i18n catalog check
    runs-on: ubuntu-latest
    env:
      BABEL_VERSION: "2.16.0"
      POLIB_VERSION: "1.2.0"

    steps:
      - # Checkout repository code
        name: Checkout
        uses: actions/checkout@v7

      - # Load central tool-version pins, overriding the env: fallbacks above.
        name: Load tool versions
        run: |
          if [ -f .development/versions.env ]; then
            grep -vE '^\s*(#|$)' .development/versions.env >> "$GITHUB_ENV"
          fi

      - # Setup Python 3.12 for i18n tools
        name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - # Create venv and install Babel and polib for i18n
        name: Create venv and install minimal i18n deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install setuptools "Babel==${{ env.BABEL_VERSION }}" "polib==${{ env.POLIB_VERSION }}" Jinja2

      - # Extract and validate translation catalog
        name: Verify messages.pot is up to date
        run: |
          . .venv/bin/activate
          ./.venv/bin/pybabel extract --sort-output -F babel.cfg -o /tmp/messages.pot setup.py octoprint_pandabreath tests
          python - <<'PY'
          import re
          import sys
          try:
              import polib
          except ImportError:
              polib = None
          import pathlib

          def extract_entries(path: str):
              """Return a frozenset of (msgid, msgctxt) from a POT file, ignoring headers."""
              if polib:
                  try:
                      catalog = polib.pofile(path)
                      return frozenset(
                          (e.msgid, e.msgctxt or "")
                          for e in catalog
                          if not e.obsolete and e.msgid
                      )
                  except Exception:
                      pass
              # Fallback: crude text extraction of msgid strings
              text = pathlib.Path(path).read_text(encoding="utf-8")
              ids = set()
              for m in re.finditer(r'^msgid\s+"(.*)"', text, re.MULTILINE):
                  val = m.group(1)
                  if val:
                      ids.add(val)
              return frozenset(ids)

          repo = "translations/messages.pot"
          tmp = "/tmp/messages.pot"

          if not pathlib.Path(repo).exists():
              print(f"Missing {repo}")
              sys.exit(1)

          repo_ids = extract_entries(repo)
          tmp_ids = extract_entries(tmp)

          added = tmp_ids - repo_ids
          removed = repo_ids - tmp_ids

          if added or removed:
              print("translations/messages.pot is out of date.")
              if added:
                  print(f"  New msgids not in committed POT ({len(added)}):")
                  for mid, ctx in sorted(added)[:10]:
                      print(f"    + {mid!r}" + (f" [ctx={ctx!r}]" if ctx else ""))
              if removed:
                  print(f"  Removed msgids still in committed POT ({len(removed)}):")
                  for mid, ctx in sorted(removed)[:10]:
                      print(f"    - {mid!r}" + (f" [ctx={ctx!r}]" if ctx else ""))
              print("Run: bash .scripts/compile_translations.sh")
              sys.exit(1)
          print(f"translations/messages.pot is up to date ({len(repo_ids)} msgids).")
          PY

      - # Compile translation catalogs and copy to plugin directory
        name: Compile catalogs
        run: |
          . .venv/bin/activate
          ./.venv/bin/pybabel compile -d translations
          mkdir -p octoprint_pandabreath/translations
          if [ -n "$(find translations -maxdepth 2 -type f -print -quit 2>/dev/null)" ]; then
            cp -a translations/* octoprint_pandabreath/translations/
          else
            echo "Warning: translations/ is empty or missing; skipping copy"
          fi
